name: Android AAB (release assinado)

# Gera o Android App Bundle (.aab) ASSINADO para enviar à Play Store.
# Roda só quando você aciona manualmente (aba Actions -> este workflow -> Run),
# ou ao criar uma tag "v*" (ex.: git tag v1.0.0 && git push --tags).
#
# Precisa destes 4 segredos no repo (Settings -> Secrets and variables -> Actions):
#   ANDROID_KEYSTORE_BASE64   -> conteúdo do .jks em base64
#   ANDROID_KEYSTORE_PASSWORD -> senha do keystore
#   ANDROID_KEY_ALIAS         -> "upload"
#   ANDROID_KEY_PASSWORD      -> senha da chave (= a do keystore se você apertou Enter)
#
# Sem os segredos o job falha de propósito (não gera .aab não assinado).

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build web (anúncios REAIS)
        run: pnpm exec vite build --mode androidrelease

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Restore keystore + keystore.properties
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::error::Faltam os segredos ANDROID_KEYSTORE_*. Configure-os no repo."
            exit 1
          fi
          echo "$KS_B64" | base64 -d > android/keystore.jks
          {
            echo "storeFile=keystore.jks"
            echo "storePassword=$KS_PASS"
            echo "keyAlias=$KS_ALIAS"
            echo "keyPassword=$KEY_PASS"
          } > android/keystore.properties

      - name: Apply native tweaks (AdMob, versão, signingConfig)
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: node scripts/android-postsync.mjs

      - name: Point Gradle at the SDK
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Bundle release AAB
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon

      - name: Verify the AAB is signed
        run: |
          f=android/app/build/outputs/bundle/release/app-release.aab
          test -f "$f" || { echo "::error::AAB não gerado"; exit 1; }
          unzip -l "$f" | grep -q "META-INF/.*\.RSA\|META-INF/MANIFEST.MF" && echo "AAB OK: $f"

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: neon-blockfall-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Cleanup secrets from runner
        if: always()
        run: rm -f android/keystore.jks android/keystore.properties
